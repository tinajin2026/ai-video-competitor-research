name: Validate research changes
on: [pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/ingest_x.py
      - run: python scripts/build.py
      - run: python scripts/test_site.py
